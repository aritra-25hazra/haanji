[project]
name = "haanji-engine"
version = "1.1.0"
description = "Real-time voice-agent engine for Indian languages: Bhasha Bridge, Speculative Turn Execution and the Pramaan Ledger"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Aritra Hazra" }, { name = "Prabhav Upadhayay" }, { name = "Anuj Uniyal" },
]
keywords = ["voice agent", "speech recognition", "Hinglish", "code-mixed", "phonetic matching",
            "contextual biasing", "speculative execution", "verifiable receipts", "India"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: Hindi",
  "Natural Language :: Bengali",
  "Natural Language :: Marathi",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Telephony",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["cryptography>=42.0", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/aritra-25hazra/haanji"
Documentation = "https://aritra-25hazra.github.io/haanji/"
Repository = "https://github.com/aritra-25hazra/haanji"
Changelog = "https://github.com/aritra-25hazra/haanji/blob/main/CHANGELOG.md"
Report = "https://github.com/aritra-25hazra/haanji/blob/main/research/REPORT.md"

[project.optional-dependencies]
dev  = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "hypothesis>=6.0"]
web  = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pywebpush>=2.0"]
live = ["websockets>=12.0", "httpx>=0.27"]
llm  = ["anthropic>=0.50"]
backup = ["boto3>=1.34"]
# The research harness: classic phonetic keys for the baselines, Markdown for the PDF report.
research = ["jellyfish>=1.0", "metaphone>=0.6", "markdown>=3.5", "faster-whisper>=1.0"]

[project.scripts]
haanji = "haanji.cli:main"

# Only the package is a package: the demo server writes its SQLite files to
# ./var, and auto-discovery would otherwise refuse to build once that exists.
[tool.setuptools.packages.find]
include = ["haanji*"]

# The vertical packs live at the repository root; `make dist` (and the publish
# workflow) copy them into haanji/packs/ so a wheel carries them too.
[tool.setuptools.package-data]
haanji = ["packs/*.yaml", "web/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
exclude = ["tests/visual_check.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# E501: long lines are a later pass. B905: zip(strict=) adds nothing here, every zip is over
# lists built together to the same length.
ignore = ["E501", "B905"]

[tool.ruff.lint.isort]
# The repository's import style: `from __future__ import annotations`, then the
# standard library with no blank line, then a gap before third-party and local imports.
no-lines-before = ["standard-library"]

[tool.ruff.lint.per-file-ignores]
# server.py, policy.py and nlu.py are being edited on another branch; their lint pass follows that merge.
"haanji/server.py" = ["B904", "E402", "E741", "I001"]
"haanji/policy.py" = ["F841"]
"haanji/nlu.py" = ["B033", "B007"]
# Dense transliteration tables, deliberately one rule per line.
"haanji/devanagari.py" = ["E702"]
