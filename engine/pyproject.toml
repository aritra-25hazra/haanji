[project]
name = "haanji-engine"
version = "0.4.0"
description = "Real-time voice-agent engine for Indian languages: Bhasha Bridge, Speculative Turn Execution and the Pramaan Ledger"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Aritra Hazra" }, { name = "Prabhav Upadhayay" }, { name = "Anuj Uniyal" },
]
dependencies = ["cryptography>=42.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev  = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "hypothesis>=6.0"]
web  = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
live = ["websockets>=12.0", "httpx>=0.27"]
llm  = ["anthropic>=0.50"]
# The research harness: classic phonetic keys for the baselines, Markdown for the PDF report.
research = ["jellyfish>=1.0", "metaphone>=0.6", "markdown>=3.5", "faster-whisper>=1.0"]

[project.scripts]
haanji = "haanji.cli:main"

# Only the package is a package: the demo server writes its SQLite files to
# ./var, and auto-discovery would otherwise refuse to build once that exists.
[tool.setuptools.packages.find]
include = ["haanji*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
