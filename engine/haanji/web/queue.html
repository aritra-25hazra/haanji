<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HaanJi — Now serving</title>
<link rel="icon" href="static/icon-192.png" type="image/png">
<link rel="stylesheet" href="static/fonts.css">
<link rel="stylesheet" href="static/signboard.css">
<style>
  /* The waiting-room screen: big tokens, readable across a room. It shows
     tokens and doctors only, never a patient's name or number. */
  body { min-height: 100dvh; display: flex; flex-direction: column; }
  header.tv { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 28px;
              border-bottom: 1px solid rgba(245, 185, 30, .28); flex-wrap: wrap; }
  header.tv h1 { font-size: clamp(22px, 3vw, 34px); margin: 0; }
  header.tv .meta { display: flex; align-items: center; gap: 14px; color: var(--haze); font-size: 15px; }
  header.tv select { min-height: 40px; border-radius: var(--r-ctl); background: var(--cobalt-deep); color: var(--chalk);
                     border: 1.5px solid rgba(255, 247, 230, .3); padding: 0 10px; }
  main { flex: 1; padding: 22px 28px 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .line { border: 1px solid rgba(255, 247, 230, .16); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
  .line .dept { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--haze); }
  .line .doc { font-size: 20px; font-weight: 600; }
  .line .now { font-family: var(--font-mono); font-size: clamp(42px, 5vw, 64px); line-height: 1; color: var(--marigold); margin: 6px 0; }
  .line .now.idle { color: rgba(255, 247, 230, .35); font-size: clamp(28px, 3vw, 40px); }
  .line .next { font-family: var(--font-mono); font-size: 16px; color: var(--chalk); }
  .line .count { font-size: 14px; color: var(--haze); }
  .line.flash { animation: flash 1.6s ease-out 1; }
  @keyframes flash { 0% { background: rgba(245, 185, 30, .35); } 100% { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { .line.flash { animation: none; } }
  .empty { color: var(--haze); font-size: 18px; }
  footer.tv { padding: 10px 28px 18px; color: var(--haze); font-size: 13px; }
</style>
</head>
<body>
<header class="tv">
  <div>
    <a class="wordmark" href="./">HaanJi <span class="dev">हाँजी</span></a>
    <h1 id="biz" data-hi="Ab kiski baari">Now serving</h1>
  </div>
  <div class="meta">
    <select id="pack" aria-label="Shop"></select>
    <span id="clock" class="mono"></span>
    <div data-lang-switch></div>
  </div>
</header>
<main id="main">
  <div class="grid" id="grid" aria-live="polite"></div>
</main>
<footer class="tv" data-hi="Naam ya number yahan kabhi nahi dikhte. Apna token reception par check-in karte waqt milta hai.">Names and phone numbers are never shown here. Your token is given at reception when you check in.</footer>
<script src="static/signboard.js"></script>
<script src="static/lang.js"></script>
<script>
(function () {
  "use strict";
  const S = window.Signboard, L = window.HaanJiLang.t;
  const $ = function (id) { return document.getElementById(id); };
  let last = {};

  function tick() {
    $("clock").textContent = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Kolkata" });
  }

  async function load() {
    let d = null;
    try {
      const r = await fetch("api/queue/display?pack=" + encodeURIComponent($("pack").value));
      d = r.ok ? await r.json() : null;
    } catch (e) { d = null; }
    const grid = $("grid");
    if (!d) { grid.innerHTML = '<p class="empty">' + S.esc(L("The server is waking up; this screen refreshes on its own.", "Server jaag raha hai; ye screen apne aap refresh hogi.")) + "</p>"; return; }
    const lines = d.lines.filter(function (l) { return l.serving || l.waiting; });
    if (!lines.length) { grid.innerHTML = '<p class="empty">' + S.esc(L("No one is waiting right now.", "Abhi koi line mein nahi hai.")) + "</p>"; last = {}; return; }
    grid.innerHTML = lines.map(function (l) {
      const changed = last[l.staff] !== undefined && last[l.staff] !== l.serving;
      return '<section class="line' + (changed ? " flash" : "") + '">' +
        (l.department ? '<span class="dept">' + S.esc(l.department) + "</span>" : "") +
        '<span class="doc">' + S.esc(l.staff) + "</span>" +
        '<span class="now' + (l.serving ? "" : " idle") + '">' + S.esc(l.serving || L("—", "—")) + "</span>" +
        (l.next.length ? '<span class="next">' + S.esc(L("Next: ", "Agla: ") + l.next.join("  ")) + "</span>" : "") +
        '<span class="count">' + S.esc(l.waiting === 1 ? L("1 waiting", "1 intezaar mein") : L(l.waiting + " waiting", l.waiting + " intezaar mein")) + "</span>" +
        "</section>";
    }).join("");
    last = {};
    lines.forEach(function (l) { last[l.staff] = l.serving; });
  }

  S.status().then(function (s) {
    if (!s) { load(); return; }
    $("pack").innerHTML = S.packOptions(s, new URLSearchParams(location.search).get("pack"));
    load();
  });
  $("pack").addEventListener("change", function () { last = {}; load(); });
  tick(); setInterval(tick, 15000);
  setInterval(load, 5000);
})();
</script>
</body>
</html>
