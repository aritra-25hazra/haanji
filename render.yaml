# Render blueprint: the voice engine, as one self-contained Docker service.
#
# The engine's serve mode is the whole demo in one process -- web calls, the
# WhatsApp simulator, the public Pramaan verifier and the insights API -- and
# it needs no database, so there is nothing else to provision here. The React
# console is deployed separately on Vercel and reaches this service through a
# rewrite, which keeps it same-origin and so keeps CORS out of the picture.
services:
  - type: web
    name: haanji-engine
    runtime: docker
    dockerfilePath: ./engine/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      # Mock providers: no API keys, and the demo exercises the real code path.
      - key: HAANJI_PROVIDER_STT
        value: mock
      - key: HAANJI_PROVIDER_LLM
        value: mock
      # Flip HAANJI_PROVIDER_LLM to "claude" and paste the key in the Render
      # dashboard to put a real model behind the dialogue boundary. Every
      # booking still goes through the engine's own read-back and the ledger.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HAANJI_LLM_MODEL
        value: claude-opus-4-8
      - key: HAANJI_LLM_EFFORT
        value: low
      - key: HAANJI_PROVIDER_TTS
        value: mock
      - key: HAANJI_PACK
        value: dental_clinic
      # Writable on the instance's ephemeral disk; the demo data is meant to be
      # disposable, and a redeploy starts it clean.
      - key: HAANJI_VAR_DIR
        value: /app/var
      # Allows the console's own origin in case it ever calls the engine
      # directly instead of through the Vercel rewrite.
      - key: HAANJI_CORS_ORIGIN_REGEX
        value: https://haanji-kappa\.vercel\.app|http://(localhost|127\.0\.0\.1)(:\d+)?
      # Secrets a real shop sets (all optional for the public demo):
      #   HAANJI_LEDGER_KEY_SECRET   encrypts the tenants' Ed25519 signing keys at rest
      #   HAANJI_METRICS_TOKEN       bearer token Prometheus sends to /metrics
      #   HAANJI_MISSED_CALL_SECRET  X-HaanJi-Secret the telephony provider sends to /api/telephony/missed-call
      #   HAANJI_WA_TEMPLATE_OTP / _REMINDER / _RECEIPT / _DIGEST / _OUTREACH
      #                              approved Meta template names (needed outside the 24-hour window)
      # Behind Render's proxy X-Forwarded-* is trusted (HAANJI_TRUST_PROXY=1,
      # the default; RENDER is set so uvicorn honours the forwarded scheme).
      - key: HAANJI_LEDGER_KEY_SECRET
        sync: false
      - key: HAANJI_METRICS_TOKEN
        sync: false
      - key: HAANJI_MISSED_CALL_SECRET
        sync: false
      # The public demo seeds "Vijay Sharma" so the returning-caller greeting
      # can be shown; a real shop (HAANJI_AUTH=on) starts with an empty table.
      - key: HAANJI_DEMO
        value: "1"
      # Privacy defaults the public demo also keeps: a spoken notice at the
      # start of every call, and call records purged after 180 days (bookings
      # and receipts stay; docs/privacy-dpdp.md).
      - key: HAANJI_CONSENT_LINE
        value: "Ye call quality aur record ke liye save hoti hai."
      - key: HAANJI_RETENTION_DAYS
        value: "180"
      # With sign-in off, a public server is a read-only demo for strangers:
      # settings, cancellations, users, pack saves, erasure and backups are
      # refused (HAANJI_DEMO_WRITES=1 re-opens them for a private demo).
      - key: HAANJI_DEMO_WRITES
        value: "0"
      # Durable records on an ephemeral disk: nightly backups to S3-compatible
      # storage and a restore on boot. Set these before trusting the service
      # with a real shop's bookings (docs/operations.md).
      - key: HAANJI_BACKUP_S3_BUCKET
        sync: false
      - key: HAANJI_BACKUP_S3_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: HAANJI_RESTORE_FROM
        sync: false
      # Where the owner console is hosted, so the landing page can link to it.
      - key: HAANJI_CONSOLE_URL
        value: https://haanji-kappa.vercel.app
      # A real WhatsApp number (Meta Cloud API). The values are entered in the
      # Render dashboard, never here — docs/whatsapp-setup.md walks through it.
      # Left empty, the simulator keeps working and the webhook stays dormant.
      - key: HAANJI_WA_TOKEN
        sync: false
      - key: HAANJI_WA_PHONE_ID
        sync: false
      - key: HAANJI_WA_VERIFY_TOKEN
        sync: false
      - key: HAANJI_WA_APP_SECRET
        sync: false
      - key: HAANJI_WA_DISPLAY_NUMBER
        sync: false
      - key: HAANJI_WA_PACK
        value: dental_clinic
      # The owner's number: receives the evening digest and, with
      # HAANJI_AUTH=on, becomes the first console owner (sign-in by WhatsApp
      # code). Keep auth off for a public demo; turn it on for a real shop.
      - key: HAANJI_OWNER_PHONE
        sync: false
      - key: HAANJI_AUTH
        value: "off"
      - key: HAANJI_AUTH_SECRET
        sync: false
      - key: HAANJI_DIGEST_HOUR
        value: "20"
      # A real phone number (docs/phone-setup.md): Twilio rings the engine,
      # Deepgram hears, ElevenLabs speaks. All entered in the dashboard.
      - key: HAANJI_TWILIO_AUTH_TOKEN
        sync: false
      - key: HAANJI_DEEPGRAM_KEY
        sync: false
      - key: HAANJI_ELEVENLABS_KEY
        sync: false
      - key: HAANJI_ELEVENLABS_VOICE
        sync: false
      - key: HAANJI_PHONE_DISPLAY
        sync: false
      # Google Calendar (console → Calendar → "Google Calendar jodo").
      - key: HAANJI_GOOGLE_CLIENT_ID
        sync: false
      - key: HAANJI_GOOGLE_CLIENT_SECRET
        sync: false
