name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "research/*.md", "research/figures/**", "mkdocs.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: install mkdocs
        run: pip install "mkdocs<2" "mkdocs-material>=9.5,<10" pymdown-extensions
      - name: bring the report and the paper into the site
        run: make docs-sync
      - name: build
        run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
