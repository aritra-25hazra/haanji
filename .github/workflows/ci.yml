name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  engine:
    name: voice engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: install
        working-directory: engine
        run: pip install -e ".[dev,web,llm]" jellyfish metaphone
      - name: lint
        working-directory: engine
        run: pip install ruff && ruff check haanji
      - name: unit and property tests
        working-directory: engine
        run: pytest -q
      - name: the README and the report quote the repository's real counts
        run: python research/harness/readme_sync.py --check
      - name: every packaged scenario must still reach its expected outcome
        working-directory: engine
        run: python -m haanji.cli selftest --speed 60
      - name: regenerate the measured results
        working-directory: engine
        run: python -m haanji.bench --reps 3 --speed 90
      - uses: actions/upload-artifact@v4
        with:
          name: measured-results
          path: research/results.json

  engine-postgres:
    name: voice engine on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: haanji, POSTGRES_PASSWORD: haanji, POSTGRES_DB: haanji_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haanji" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HAANJI_DATABASE_URL: postgresql://haanji:haanji@localhost:5432/haanji_test
      HAANJI_VAULT_SECRET: ci-vault-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: install
        working-directory: engine
        run: pip install -e ".[dev,web,llm,postgres]" jellyfish metaphone
      - name: the whole suite, every store on Postgres
        working-directory: engine
        run: pytest -q

  console:
    name: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: console/package-lock.json }
      - name: install
        working-directory: console
        run: npm install
      - name: lint
        working-directory: console
        run: npm run lint
      - name: component and unit tests (jsdom, mocked engine)
        working-directory: console
        run: npm test
      - name: typecheck and build
        working-directory: console
        run: npm run build
