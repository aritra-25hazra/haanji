name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  engine:
    name: voice engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: install
        working-directory: engine
        run: pip install -e ".[dev]"
      - name: unit and property tests
        working-directory: engine
        run: pytest -q
      - name: every packaged scenario must still reach its expected outcome
        working-directory: engine
        run: python -m haanji.cli selftest --speed 60
      - name: regenerate the measured results
        working-directory: engine
        run: python -m haanji.bench --reps 3 --speed 90
      - uses: actions/upload-artifact@v4
        with:
          name: measured-results
          path: research/results.json

  core-api:
    name: core api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: build, unit tests and architecture rules
        working-directory: core-api
        run: mvn -B verify

  console:
    name: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: console/package.json }
      - working-directory: console
        run: npm install
      - working-directory: console
        run: npm run build
