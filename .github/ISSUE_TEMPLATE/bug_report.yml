name: Bug report
description: Something in HaanJi does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A security problem goes through **Security → Report a vulnerability**, not here.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Call (/talk or phone)
        - WhatsApp
        - Queue (/queue)
        - Owner console
        - Verifier (/verify)
        - Engine / CLI / tests
        - Docs
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      placeholder: "I said 'kal subah dant dikhana hai' and got … instead of …"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Type …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The live site, or the commit you ran (git rev-parse --short HEAD).
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove phone numbers, names and any keys first.
      render: text
