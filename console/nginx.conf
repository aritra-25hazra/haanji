server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A single-page app: unknown paths are routes, not missing files.
    location / { try_files $uri $uri/ /index.html; }

    location /api/ {
        proxy_pass http://core-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The engine's demo pages and JSON, with the prefix stripped — the same
    # shape vite.config.ts proxies in development and vercel.json in production.
    location /engine/ {
        proxy_pass http://engine:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(js|css|woff2|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
