server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A single-page app: unknown paths are routes, not missing files.
    location / { try_files $uri $uri/ /index.html; }

    # The engine's pages and JSON, with the prefix stripped — the same shape
    # vite.config.ts proxies in development and vercel.json in production.
    # Everything the console needs is served by the engine; there is no
    # second API behind this console.
    location /engine/ {
        proxy_pass http://engine:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Server-sent events: no buffering, long-lived connections.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location ~* \.(js|css|woff2|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
