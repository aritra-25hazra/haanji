site_name: HaanJi
site_description: A voice receptionist for Indian small businesses that hears the business's own words, answers before the caller finishes, and can prove what was agreed.
site_url: https://aritra-25hazra.github.io/haanji/
repo_url: https://github.com/aritra-25hazra/haanji
repo_name: aritra-25hazra/haanji
edit_uri: edit/main/docs/
copyright: Apache-2.0 · Aritra Hazra, Prabhav Upadhayay, Anuj Uniyal

docs_dir: docs
exclude_docs: |
  superpowers/
  study/analysis.py

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: teal
      toggle: { icon: material/brightness-7, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: teal
      toggle: { icon: material/brightness-4, name: Light }
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Running it:
      - WhatsApp: whatsapp-setup.md
      - A phone number: phone-setup.md
      - Console sign-in: console-auth.md
      - Your own domain: custom-domain.md
      - Demo script: demo-script.md
  - Trust:
      - Pramaan ledger, formally: pramaan-security.md
      - Privacy and the DPDP Act: privacy-dpdp.md
  - Research:
      - The report: research/REPORT.md
      - The paper: research/PAPER.md
      - Failure gallery: failure-gallery.md
      - Against the competition: competitors.md
      - Diagrams: diagrams.md
      - User study protocol: study/protocol.md
  - Viva: viva.md
