# One command brings the whole system up:  docker compose up --build
#
# The engine's serve mode is the whole platform — web calls, WhatsApp, the
# verifier, the owner console's API — on one process with SQLite under
# ./var. The console is a static site that proxies /engine/ to it. Prometheus
# and Grafana watch the engine's /metrics.
#
# The Java control plane that used to sit here is in experimental/ (see
# experimental/README.md): nothing in the running system called it.

name: haanji

services:
  engine:
    build: { context: ., dockerfile: engine/Dockerfile }
    environment:
      HAANJI_PACK_DIR: /packs
      HAANJI_VAR_DIR: /app/var
      HAANJI_PROVIDER_STT: ${HAANJI_PROVIDER_STT:-mock}
      HAANJI_PROVIDER_LLM: ${HAANJI_PROVIDER_LLM:-mock}
      HAANJI_PROVIDER_TTS: ${HAANJI_PROVIDER_TTS:-mock}
      HAANJI_DEMO: "1"
    volumes:
      - "./packs:/packs:ro"
      - engine-data:/app/var          # bookings, ledgers, keys: survives a rebuild
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/status', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1g }

  console:
    build: { context: ./console }
    ports: ["5173:80"]
    depends_on:
      engine: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - "./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./ops/alerts.yml:/etc/prometheus/alerts.yml:ro"
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: haanji
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: ["./ops/grafana:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  engine-data:
