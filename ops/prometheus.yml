global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: engine
    metrics_path: /metrics
    static_configs: [{ targets: ["engine:8090"] }]
    # With HAANJI_METRICS_TOKEN set on the engine, scrape with it:
    # authorization: { type: Bearer, credentials: "<the token>" }

rule_files: ["alerts.yml"]

# Outside Docker, point the engine job at a running demo server instead:
#   static_configs: [{ targets: ["host.docker.internal:8090"] }]
