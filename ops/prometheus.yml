global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: core-api
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["core-api:8080"] }]

  - job_name: engine
    metrics_path: /metrics
    static_configs: [{ targets: ["engine:8090"] }]

rule_files: ["alerts.yml"]
